<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luffy</title>
<style>
:root{--ink:#1b2340;--mute:#5d6a8c;--card:#fff;--line:#cfe0f5;--a:#ffd23f;--b:#ff8a3d;--c:#ff4d6d}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#bfe3ff 0%,#eaf6ff 45%,#fff 100%);color:var(--ink);font:400 16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header,#log,#dock,#keybox{position:relative;z-index:1}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 16%,#fffbe0 0,#ffe98a 8%,rgba(255,214,70,.45) 20%,transparent 46%)}
.cloud{position:absolute;left:-30%;height:46px;width:150px;background:#fff;border-radius:99px;box-shadow:0 8px 24px rgba(120,170,230,.25);animation:drift 70s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:70px;height:70px;left:22px;top:-34px}.cloud::after{width:52px;height:52px;left:80px;top:-22px}
.c1{top:22%;animation-delay:-10s}.c2{top:46%;transform:scale(1.5);animation-duration:95s;animation-delay:-50s}.c3{top:70%;transform:scale(.8);animation-duration:80s;animation-delay:-30s}
@keyframes drift{to{left:120%}}
.bolt{position:absolute;top:0;height:100%;width:70px;opacity:.85;filter:drop-shadow(0 0 6px #ffd23f)}.bolt.l{left:0}.bolt.r{right:0;transform:scaleX(-1)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
header .logo{width:36px;height:36px}header b{font-size:20px;font-weight:700;flex:1}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:6px 12px;font:600 13px system-ui,sans-serif}
#log{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
#hero{margin:auto;text-align:center;padding:12px}
#hero .logo{width:96px;height:96px;filter:drop-shadow(0 10px 30px rgba(255,138,61,.5))}
#hero h1{font-size:30px;line-height:1.15;margin:18px 0 6px}
#hero p{margin:0 auto;color:var(--mute);max-width:30ch}
.chatting #hero{display:none}
.m{max-width:86%;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word}
.m.user{align-self:flex-end;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px}
.m.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:6px 20px 20px 20px}
#keybox{margin:0 16px 8px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;gap:8px;flex-wrap:wrap}
#keybox p{margin:0;width:100%;font-size:13px;color:var(--mute)}
#keybox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px}
#keybox button{border:0;border-radius:12px;background:var(--ink);color:#fff;padding:10px 16px;font-weight:600}
#dock{padding:8px 16px 16px}
#state{text-align:center;color:var(--mute);font-size:13px;min-height:20px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px}
#q{flex:1;min-width:0;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:14px 18px;font-size:16px}
#orb{position:relative;width:64px;height:64px;border:0;background:none;border-radius:50%;color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 0 28px rgba(255,138,61,.5)}
#orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--c),var(--a))}
#orb::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
#orb svg{position:relative;z-index:1;width:26px;height:26px}
#orb.listening{animation:pulse 1s ease-in-out infinite}#orb.thinking::before{animation:spin 1.1s linear infinite}
@keyframes pulse{50%{transform:scale(1.14)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div id="sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
<svg class="bolt l" viewBox="0 0 70 600" preserveAspectRatio="none"><polyline points="10,0 34,140 14,150 42,300 18,312 50,470 30,480 56,600" fill="none" stroke="#fff" stroke-width="3"/><polyline points="10,0 34,140 14,150 42,300 18,312 50,470 30,480 56,600" fill="none" stroke="#ffd23f" stroke-width="1.2"/></svg>
<svg class="bolt r" viewBox="0 0 70 600" preserveAspectRatio="none"><polyline points="6,0 30,120 10,132 38,280 14,292 46,450 26,460 52,600" fill="none" stroke="#fff" stroke-width="3"/><polyline points="6,0 30,120 10,132 38,280 14,292 46,450 26,460 52,600" fill="none" stroke="#ffd23f" stroke-width="1.2"/></svg></div>
<header><span id="hlogo"></span><b>Luffy</b><button class="ghost" id="keyb">API key</button></header>
<main id="log"><section id="hero"><span id="blogo"></span><h1>Hi, I’m Luffy.</h1><p>Manjit made me. Tell me what to do on your phone, or ask me anything.</p></section></main>
<div id="keybox" hidden><p>Paste your Anthropic API key so I can answer questions. Phone commands work without it.</p><input id="key" type="password" placeholder="sk-ant-…" autocomplete="off"><button id="savekey">Save</button></div>
<div id="dock"><div id="state">Tap the orb and speak</div>
<button class="ghost" id="wake" style="display:block;margin:0 auto 10px">Wake word “Luffy”: off</button>
<div class="row"><input id="q" placeholder="Type a command or question" enterkeyhint="send" autocomplete="off">
<button id="orb" aria-label="Speak a command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div></div>
<script>
const $=s=>document.querySelector(s);
const logo=id=>`<svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset=".55" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#${id})"/><circle cx="32" cy="38" r="15" fill="#ffd9b8"/><path d="M17 37c-1-9 4-13 15-13s16 4 15 13c-2-5-6-8-15-8s-13 3-15 8z" fill="#1d1a2b"/><circle cx="22.5" cy="42" r="2.6" fill="#ff8f8f" opacity=".6"/><circle cx="41.5" cy="42" r="2.6" fill="#ff8f8f" opacity=".6"/><circle cx="26" cy="38" r="1.9" fill="#1d1a2b"/><circle cx="38" cy="38" r="1.9" fill="#1d1a2b"/><path d="M23.5 43.5q8.5 9 17 0z" fill="#7a1d2a"/><path d="M25 43.8h14" stroke="#fff" stroke-width="1.6"/><path d="M20 27c0-12 5-16 12-16s12 4 12 16z" fill="#f6c445"/><rect x="20" y="21.5" width="24" height="4.5" fill="#e23b3b"/><ellipse cx="32" cy="27.5" rx="22" ry="5.5" fill="#f6c445" stroke="#d9962b"/></svg>`;
$('#hlogo').innerHTML=logo('g1');$('#blogo').innerHTML=logo('g2');
const log=$('#log'),inp=$('#q'),orb=$('#orb'),st=$('#state');let wake=false;
function setState(s){orb.className=s==='idle'?'':s;st.textContent={idle:wake?'Say “Luffy”, then your command':'Tap the orb and speak',listening:'Listening…',thinking:'Thinking…'}[s]}
function add(r,t){const d=document.createElement('div');d.className='m '+r;d.textContent=t;log.appendChild(d);document.body.classList.add('chatting');log.scrollTop=log.scrollHeight}
window.onHeard=t=>add('user',t);
window.onReply=t=>{add('ai',t);setState('idle')};
window.onState=setState;
function send(t){t=t.trim();if(!t)return;inp.value='';add('user',t);setState('thinking');Luffy.send(t)}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send(inp.value)});
orb.onclick=()=>Luffy.listen();
$('#wake').onclick=()=>{wake=!wake;$('#wake').textContent='Wake word “Luffy”: '+(wake?'on':'off');Luffy.setWake(wake);
 if(wake&&!Luffy.overlayGranted()){add('ai','To open apps and make calls while I’m in the background, allow “Display over other apps” for Luffy.');Luffy.askOverlay()}setState('idle')};
$('#keyb').onclick=()=>{const b=$('#keybox');b.hidden=!b.hidden;$('#key').value=Luffy.getKey()};
$('#savekey').onclick=()=>{Luffy.setKey($('#key').value.trim());$('#keybox').hidden=true;add('ai','Saved. Ask me anything!')};
if(!Luffy.getKey())$('#keybox').hidden=false;
</script></body></html>
